name: Offline code checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Tests use only Node built-ins and synthetic mocks; no service or npm access.
      - run: node tests/syntax-check.cjs
      - run: node --test tests/*.test.cjs
      - run: node build.mjs
      - name: Verify deterministic downloadable build
        run: git diff --exit-code -- '勞報單填寫工具.html'
